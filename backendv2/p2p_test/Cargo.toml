[package]
name = "p2p_test"
version = "0.1.0"
edition = "2024"

[dependencies]
# NAPI-RS dependencies for your host setup
napi = { version = "2.16", features = ["tokio_rt"] }
napi-derive = "2.16"

# Tokio ecosystem
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

# Libp2p ecosystem (modern modular setup)
libp2p = { version = "0.54", features = ["tcp", "noise", "yamux", "tokio"] }
libp2p-stream = "0.2.0-alpha" # Note: stream is currently in alpha/experimental features depending on your exact version target
