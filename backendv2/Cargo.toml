[package]
name = "backendv2"
version = "0.1.0"
edition = "2021"

[dependencies]
once_cell = "1.21.4"
bollard = "0.20.2"
sqlx = "0.9.0-alpha.1"
napi = { version = "2.12", features = ["async", "tokio_rt"] }
napi-derive = "2.12"
tokio = { version = "1.50.0", features = ["fs"] }
dirs = "6.0.0"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
lazy_static = "1.5.0"
reqwest = { version = "0.13.2", features = ["json"] }
strum_macros = "0.28.0"
dashmap = "7.0.0-rc2"


[lib]
name = "backendv2"     # This should match your project name
crate-type = ["cdylib"] # Tells Rust to build a dynamic library for NAPI
path = "src/lib.rs"

