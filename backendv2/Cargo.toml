[package]
name = "backendv2"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core N-API - Updated to latest stable
napi = { version = "2.16", features = ["async", "tokio_rt"] }
napi-derive = "2.16"

# Async Runtime - Ensure macros and full runtime are present for reqwest/bollard
tokio = { version = "1.38", features = ["fs", "rt-multi-thread", "macros"] }

# Utilities
once_cell = "1.19"
dirs = "5.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
strum_macros = "0.26"
dashmap = "6.0"
reqwest = { version = "0.13.2", features = ["json"] }
glob = "0.3"
zip = "8.6.0"

[build-dependencies]
napi-build = "2.1"

[lib]
name = "backendv2"
crate-type = ["cdylib"]
