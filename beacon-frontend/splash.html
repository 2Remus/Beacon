<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            /* Exact Colors from Beacon Hub Screenshot */
            --hub-bg: #1e2126;
            --hub-blue: #007bff;
            --hub-text-muted: #8a8d91;
            --hub-text-white: #ffffff;
            --minecraft-glass: rgba(255, 255, 255, 0.08);
            --charge-duration: 1.2s;
        }

        body {
            background: var(--hub-bg);
            color: var(--hub-text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .beacon-system {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        /* --- THE SHAKE --- */
        .shake-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: jitter-shake-violent var(--charge-duration) cubic-bezier(.36,.07,.19,.97) forwards;
            z-index: 10;
        }

        /* --- THE BEAM --- */
        .beam-wrapper {
            position: absolute;
            bottom: 45px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
        }

        .main-beam {
            position: absolute;
            width: 28px;
            height: 0;
            background: linear-gradient(to top, var(--hub-blue), #fff 20%);
            box-shadow:
                    0 0 40px var(--hub-blue),
                    0 0 80px rgba(0, 123, 255, 0.3);
            animation: beam-shoot 0.3s cubic-bezier(0.05, 1, 0.1, 1) var(--charge-duration) forwards,
            beam-pulse 2s infinite 1.5s;
        }

        .beam-bloom {
            position: absolute;
            bottom: 80px;
            width: 140px;
            height: 50px;
            background: radial-gradient(ellipse at center, var(--hub-blue) 0%, transparent 70%);
            filter: blur(20px);
            opacity: 0;
            animation: bloom-fade 0.5s ease-out var(--charge-duration) forwards;
            z-index: 15;
        }

        /* --- THE BLOCK --- */
        .beacon-block {
            position: relative;
            width: 80px;
            height: 80px;
            background: var(--minecraft-glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .inner-core {
            width: 26px;
            height: 26px;
            background: var(--hub-blue);
            box-shadow: 0 0 35px 10px var(--hub-blue);
            animation: core-spin 0.4s linear infinite;
        }

        /* --- TEXT MATCHING BEACON HUB --- */
        h1 {
            font-size: 2.5rem; /* Large impact like the logo */
            font-weight: 900;
            margin: 0;
            padding: 0;
            color: var(--hub-blue);
            letter-spacing: -2px; /* Tighter spacing seen in your logo */
            text-transform: uppercase;
            /* Subtler glow than before to match the UI style */
            filter: drop-shadow(0 0 15px rgba(0, 123, 255, 0.4));
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #status {
            margin-top: -5px;
            color: var(--hub-text-muted);
            text-transform: uppercase;
            letter-spacing: 4px; /* Matches the 'Cloud Instances' header vibe */
            font-size: 0.85rem;
            font-weight: 700;
        }

        .base-plate {
            width: 100px;
            height: 8px;
            background: #111;
            border-bottom: 3px solid var(--hub-blue);
        }

        /* --- ANIMATIONS --- */
        @keyframes beam-shoot {
            from { height: 0; opacity: 0; }
            to { height: 100vh; opacity: 1; }
        }

        @keyframes beam-pulse {
            0%, 100% { filter: brightness(1); transform: scaleX(1); }
            50% { filter: brightness(1.2); transform: scaleX(1.03); }
        }

        @keyframes bloom-fade {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 0.6; transform: scale(1.1); }
        }

        @keyframes jitter-shake-violent {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 8px); }
            40% { transform: translate(8px, -8px); }
            60% { transform: translate(-10px, 4px); }
            80% { transform: translate(10px, -4px); }
            100% { transform: translate(0, 0); }
        }

        @keyframes core-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(180deg); }
        }
    </style>
</head>
<body>

<div class="beacon-system">
    <div class="beam-bloom"></div>

    <div class="beam-wrapper">
        <div class="main-beam"></div>
    </div>

    <div class="shake-container">
        <div class="beacon-block">
            <div class="inner-core"></div>
        </div>
        <div class="base-plate"></div>
    </div>
</div>

<h1>BEACON</h1>
<p id="status">Warping...</p>

<script>
    const statusText = document.getElementById('status');
    // Updated text steps to feel more 'System-like' as per the dashboard
    const phases = ["INITIALIZING CLUSTER", "MAPPING HOSTS", "STABILIZING BEAM", "SIGNAL LIVE"];
    let i = 0;
    const interval = setInterval(() => {
        if (i < phases.length) {
            statusText.innerText = phases[i];
            i++;
        } else {
            clearInterval(interval);
            statusText.style.color = "#ffffff"; // Pops to white when live
        }
    }, 450);
</script>
</body>
</html>
