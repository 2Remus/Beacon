name: Beacon Alpha 

on:
  push:
    tags: ['apptest*']

permissions:
  contents: write

jobs:
  # STAGE 1: Build Rust Binaries (Sidecars)
  build-rust-binaries:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build beacon-host
        working-directory: ./beacon-host
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build beacon-api
        working-directory: ./backend
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Binaries
        shell: bash
        run: |
          mkdir -p ./temp-bin
          cp ./beacon-host/target/${{ matrix.target }}/release/beacon-host${{ matrix.suffix }} ./temp-bin/
          cp ./backend/target/${{ matrix.target }}/release/backend${{ matrix.suffix }} ./temp-bin/beacon-api${{ matrix.suffix }}

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: ./temp-bin/

  # STAGE 2: Build and Package Electron App
  build-electron-app:
    needs: build-rust-binaries
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # THIS IS THE FIX: Explicitly pointing to the sub-directory
          cache-dependency-path: ./beacon-frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./beacon-frontend
        run: npm install

      - name: Download Rust Binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: ./bin/

      - name: Set Permissions
        if: matrix.os == 'macos-latest'
        run: chmod +x ./bin/*

      - name: Build Electron App
        working-directory: ./beacon-frontend
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload App Installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            beacon-frontend/dist/*.exe
            beacon-frontend/dist/*.dmg
            beacon-frontend/dist/*.zip

  # STAGE 3: Final GitHub Release
  create-release:
    needs: build-electron-app
    runs-on: ubuntu-latest
    steps:
      - name: Download All Installers
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            installer-windows-latest/beacon-frontend/dist/*.exe
            installer-macos-latest/beacon-frontend/dist/*.dmg
            installer-macos-latest/beacon-frontend/dist/*.zip
          generate_release_notes: true
