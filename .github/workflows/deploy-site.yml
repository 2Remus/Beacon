name: Deploy Landing Page
on:
  push:
    branches: [ 2remus-patch-1 ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install and Build
        working-directory: ./beacon-landing
        run: |
          npm install
          npm run build # Make sure this command exists in package.json

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # Point directly to the dist folder inside the sub-directory
          folder: beacon-landing/dist 
          branch: gh-pages