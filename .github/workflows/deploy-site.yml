name: Deploy Landing Page
on:
  push:
    branches: [ 2reumus-patch-1 ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install and Build
        working-directory: ./beacon-landing
        run: |
          npm install
          npm run vite:build # Make sure this command exists in package.json

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder Vite builds into
          branch: gh-pages # The branch the site lives on
