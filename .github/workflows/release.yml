name: Build Beacon Installers
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            cloudflared_src: bin/windows/cloudflared.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            cloudflared_src: bin/macOS/cloudflared
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
            cloudflared_src: bin/macOS/cloudflared

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Dependencies
        run: npm install

      # 1. Build the Rust NAPI module
      - name: Build Rust Core
        working-directory: ./backendv2
        run: |
          npm install
          npx napi build --release --target ${{ matrix.target }}

      # 2. Stage files for the Electron packager
      - name: Stage Resources
        shell: bash
        run: |
          mkdir -p bin/target
          # Standardize the .node filename for the loader
          cp backendv2/*.node ./bin/target/index.node
          
          # Move the platform-specific cloudflared
          cp ${{ matrix.cloudflared_src }} ./bin/target/cloudflared
          
          # Fix permissions for Unix-like systems
          if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
            chmod +x ./bin/target/cloudflared
          fi

      # 3. Package the installers (No Token Required)
      - name: Build App Installer
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false 

      # 4. Export the DMG and EXE
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Beacon-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg