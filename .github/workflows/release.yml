name: Build Beacon Installers
on:
  push:
    branches: [ 2remus-patch-1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            cloudflared_src: bin/win/cloudflared-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            cloudflared_src: bin/mac/cloudflared
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
            cloudflared_src: bin/mac/cloudflared

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Cache both frontend and backend dependencies
          cache-dependency-path: |
            frontendv2/package-lock.json
            backendv2/package-lock.json

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Build Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nasm cmake -y
          # Use proper GitHub Actions environment file syntax for PowerShell
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup MSVC (Windows only)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Rust Core
        working-directory: ./backendv2
        env:
          AWS_LC_SYS_PREBUILT_NASM: 1
          CARGO_TERM_COLOR: always
        run: |
          npm install
          # We run cargo check first to see errors without the napi wrapper
          cargo check --target ${{ matrix.target }}
          # Then attempt the build with verbose logging
          npx napi build --release --target ${{ matrix.target }}

      - name: Stage Resources
        shell: bash
        run: |
          # Create target directory recursively
          mkdir -p frontendv2/bin
          
          # Move compiled Rust binary
          # Use a wildcard to find the generated .node file regardless of naming
          cp backendv2/*.node frontendv2/bin/index.darwin-arm64.node

          
          # Copy cloudflared binary
          if [ -f "${{ matrix.cloudflared_src }}" ]; then
            cp "${{ matrix.cloudflared_src }}" frontendv2/bin/cloudflared
          else
            echo "Critical Error: Source binary ${{ matrix.cloudflared_src }} not found."
            exit 1
          fi
          
          # Set execution permissions for Unix-based binaries
          if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
            chmod +x frontendv2/bin/cloudflared
          fi

      - name: Build App Installer
        working-directory: ./frontendv2
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false 
        run: |
          npm install
          npm run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Beacon-${{ matrix.platform }}
          # Path logic ensures we grab the right installers for each OS
          path: |
            frontendv2/dist/*.exe
            frontendv2/dist/*.dmg
            frontendv2/dist/*.pkg