name: Build Beacon Installers
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            cloudflared_src: bin/windows/cloudflared.exe 
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            cloudflared_src: bin/mac/cloudflared
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
            cloudflared_src: bin/mac/cloudflared

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontendv2/package-lock.json

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Build Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install nasm cmake
          # Correct PowerShell syntax for updating GITHUB_PATH
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Setup MSVC (Windows only)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Rust Core
        working-directory: ./backendv2
        env:
          AWS_LC_SYS_PREBUILT_NASM: 1
        run: |
          npm install
          # Added --verbose to debug the E0433 resolution error
          npx napi build --release --target ${{ matrix.target }} --verbose

      - name: Stage Resources
        shell: bash
        run: |
          mkdir -p frontendv2/bin/target
          cp backendv2/*.node ./frontendv2/bin/target/index.node
          cp "${{ matrix.cloudflared_src }}" ./frontendv2/bin/target/cloudflared
          
          if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
            chmod +x ./frontendv2/bin/target/cloudflared
          fi

      - name: Build App Installer
        working-directory: ./frontendv2
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false 

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Beacon-${{ matrix.platform }}
          path: |
            frontendv2/dist/*.exe
            frontendv2/dist/*.dmg