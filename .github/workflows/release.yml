name: Build Beacon Installers
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            cloudflared_src: bin/windows/cloudflared-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            cloudflared_src: bin/mac/cloudflared
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
            cloudflared_src: bin/mac/cloudflared

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Fixed path to the lockfile
          cache-dependency-path: ./frontendv2/package-lock.json

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # FIXED: Tell npm to look in the frontend folder
      - name: Install Frontend Dependencies
        working-directory: ./frontendv2
        run: npm install

      - name: Build Rust Core
        working-directory: ./backendv2
        run: |
          npm install
          npx napi build --release --target ${{ matrix.target }}

      - name: Stage Resources
        shell: bash
        run: |
          mkdir -p frontendv2/bin/target
          # Copy .node from backendv2 to the frontend's staging area
          cp backendv2/*.node ./frontendv2/bin/target/index.node
          
          # Copy cloudflared from the root bin to the frontend's staging area
          cp ${{ matrix.cloxudflared_src }} ./frontendv2/bin/target/cloudflared
          
          if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
            chmod +x ./frontendv2/bin/target/cloudflared
          fi

      # FIXED: Run the build inside the frontend folder
      - name: Build App Installer
        working-directory: ./frontendv2
        run: npm run build
        env:
          CSC_IDENTITYx_AUTO_DISCOVERY: false 

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Beacon-${{ matrix.platform }}
          # Path adjusted to where electron-builder outputs
          path: |
            frontendv2/dist/*.exe
            frontendv2/dist/*.dmg